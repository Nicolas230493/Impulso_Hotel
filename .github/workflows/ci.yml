name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: impulso
          POSTGRES_USER: impulso
          POSTGRES_PASSWORD: impulso
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U impulso" --health-interval 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r requirements-dev.txt
      - run: black --check .
      - run: flake8
      - run: python manage.py makemigrations --check --dry-run
      - name: Tests (cobertura mínima 70 % en lógica de negocio)
        run: >
          pytest --create-db
          --cov=reservas.services --cov=caja.services --cov=facturacion.services --cov=habitaciones.services
          --cov=inventario.services --cov=compras.services --cov=limpieza.services --cov=mantenimiento.services
          --cov=notificaciones.services --cov=bi.services --cov=saas.services --cov-fail-under=70
