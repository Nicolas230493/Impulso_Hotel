{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block publico %}
<div class="mx-auto" style="max-width:380px">
  <div class="text-center mb-3"><h1 class="h3 fw-bold" style="color:#0b3d5c"><i class="bi bi-lightning-charge-fill"></i> Impulso Hotel</h1><p class="text-muted small">Sistema de gestión hotelera</p></div>
  <form method="post" class="card card-body shadow-sm">{% csrf_token %}
    {% include "_form_campos.html" %}
    <button class="btn btn-primary w-100 mt-3">Ingresar</button>
    <a class="small d-block text-center mt-2" href="{% url 'password_reset' %}">Olvidé mi contraseña</a>
  </form>
  <p class="text-center small mt-3"><a href="{% url 'saas_registro' %}">¿Su hotel aún no usa Impulso? Pruébelo gratis</a></p>
</div>
{% endblock %}
