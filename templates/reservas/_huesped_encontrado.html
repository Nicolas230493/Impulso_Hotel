{% if h %}<div class="alert alert-info py-1 small mb-0"><i class="bi bi-person-check"></i> Huésped existente: <b>{{ h }}</b>{% if h.telefono %} · {{ h.telefono }}{% endif %} · {{ h.reservas.count }} reserva/s. Se usará su ficha.
<script>(function(){var f=document.getElementById('form-reserva')||document;var d={nombre:"{{ h.nombre|escapejs }}",apellido:"{{ h.apellido|escapejs }}",telefono:"{{ h.telefono|escapejs }}",email:"{{ h.email|escapejs }}",nacionalidad:"{{ h.nacionalidad|escapejs }}"};for(var k in d){var el=f.querySelector('[name='+k+']');if(el&&!el.value){el.value=d[k];}}{% if h.consentimiento_datos %}var c=f.querySelector('[name=consentimiento_datos]');if(c)c.checked=true;{% endif %}{% if h.consentimiento_whatsapp %}var w=f.querySelector('[name=consentimiento_whatsapp]');if(w)w.checked=true;{% endif %}})();</script></div>{% endif %}
